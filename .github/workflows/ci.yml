name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

  unit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test:unit

  e2e:
    needs: [check, unit]
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build iOS app
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios
          cd ios && xcodebuild -workspace FilmBuddy.xcworkspace -scheme FilmBuddy -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED='NO'

      - name: Boot iOS Simulator
        uses: futureware-tech/simulator-action@v4
        with:
          model: iPhone 16

      - name: Bring Simulator to foreground
        run: open -a Simulator

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Install app on Simulator
        run: xcrun simctl install booted apps/mobile/ios/build/Build/Products/Debug-iphonesimulator/FilmBuddy.app

      - name: Debug - Launch app and screenshot
        run: |
          xcrun simctl launch booted tech.mattb.filmbuddy
          sleep 5
          xcrun simctl io booted screenshot app-launch.png
          echo "Screenshot saved to app-launch.png"

      - name: Run E2E tests
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 120000
        run: |
          # Retry loop - subsequent attempts piggyback off previous driver init
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3"
            if ~/.maestro/bin/maestro test --test-output-dir=maestro-reports apps/mobile/e2e/flows/; then
              echo "Tests passed on attempt $attempt"
              exit 0
            fi
            if [ $attempt -lt 3 ]; then
              echo "Attempt $attempt failed, retrying in 10s..."
              sleep 10
            fi
          done
          echo "All attempts failed"
          exit 1

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-reports
          path: |
            app-launch.png
            maestro-reports/
