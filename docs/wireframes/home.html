<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Home - FilmBuddy Wireframes</title>
  <link rel="stylesheet" href="wireframe.css">
</head>
<body>
  <div class="screen">
    <!-- iOS Status Bar -->
    <div class="status-bar">
      9:41 AM
    </div>

    <!-- Navigation Bar -->
    <nav class="nav-bar">
      <h1>Active Rolls</h1>
      <a href="#" class="button">
        <span class="button-icon">+</span>
      </a>
    </nav>

    <!-- Main Content -->
    <main class="content">

      <!-- Camera Section: Leica M6 -->
      <h2 class="section-header">Leica M6</h2>

      <a href="#" class="card">
        <div class="card-title">Portra 400 @400</div>
        <div class="card-subtitle">Frame 12 of 36</div>
        <div class="card-meta">3 notes</div>
      </a>

      <!-- Camera Section: Hasselblad -->
      <h2 class="section-header">Hasselblad 500C/M</h2>

      <a href="#" class="card">
        <div class="card-title">Tri-X @800</div>
        <div class="card-subtitle">Frame 5 of 12</div>
        <div class="card-meta">1 note</div>
      </a>

      <!-- Camera Section: Contax -->
      <h2 class="section-header">Contax T2</h2>

      <a href="#" class="card">
        <div class="card-title">Ektar 100 @100</div>
        <div class="card-subtitle">Frame 24 of 36</div>
        <div class="card-meta">No notes yet</div>
      </a>

    </main>

    <!-- Tab Bar -->
    <nav class="tab-bar">
      <a href="home.html" class="tab-item active">
        <div class="tab-icon"></div>
        <span>Rolls</span>
      </a>
      <a href="#" class="tab-item">
        <div class="tab-icon"></div>
        <span>Meter</span>
      </a>
      <a href="#" class="tab-item">
        <div class="tab-icon"></div>
        <span>Gear</span>
      </a>
    </nav>
  </div>
</body>
</html>
