<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Roll Sheet - FilmBuddy Wireframes</title>
    <link rel="stylesheet" href="wireframe.css" />
  </head>
  <body>
    <div class="screen">
      <!-- iOS Status Bar -->
      <div class="status-bar">9:41 AM</div>

      <!-- Dimmed background representing the rolls list behind -->
      <div class="sheet-backdrop"></div>

      <!-- Sheet -->
      <div class="sheet">
        <div class="sheet-header">
          <a href="rolls.html" class="sheet-cancel">Cancel</a>
          <h2>Edit Roll</h2>
          <a href="rolls.html" class="sheet-action">Save</a>
        </div>

        <div class="sheet-content">
          <div class="form-group">
            <label class="form-label">Film Stock</label>
            <input type="text" class="input" value="Portra 400" />
          </div>

          <div class="form-group">
            <label class="form-label">ISO</label>
            <div class="picker">
              <div class="picker-value">400</div>
              <div class="picker-arrow">▼</div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Camera</label>
            <input type="text" class="input" value="Leica M6" />
          </div>

          <div class="form-group">
            <label class="form-label form-label-meta">Loaded Nov 28</label>
          </div>
        </div>

        <div class="sheet-footer">
          <a href="rolls.html" class="button sheet-button-finish"
            >Mark as Finished</a
          >
          <a href="rolls.html" class="button sheet-button-delete"
            >Delete Roll</a
          >
        </div>
      </div>
    </div>

    <div class="note">
      Edit sheet shows current values. "Mark as Finished" and "Delete Roll"
      actions at bottom. Loaded date is shown but not editable.
    </div>
  </body>
</html>
