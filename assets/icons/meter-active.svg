<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Needle pointing up (yellow, drawn first to be behind) -->
  <line x1="12" y1="8" x2="12" y2="5" stroke="#ecc24c" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Outer body - rounded rectangle -->
  <rect x="5" y="3" width="14" height="18" rx="7" stroke="#487cab" stroke-width="1.5" fill="none"/>
  <!-- Inner dial circle -->
  <circle cx="12" cy="14" r="5" stroke="#487cab" stroke-width="1.5" fill="none"/>
  <!-- Center knob -->
  <circle cx="12" cy="14" r="2" stroke="#487cab" stroke-width="1" fill="none"/>
</svg>
