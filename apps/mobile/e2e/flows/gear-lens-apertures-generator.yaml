appId: tech.mattb.filmbuddy
---
# Setup: Launch app and navigate to Gear tab
- runFlow:
    file: ../helpers/launch.yaml
- tapOn: "gear-tab"

# =============================================================================
# Scenario 1: Generate apertures from a range (happy path)
# =============================================================================
# GIVEN I am editing a lens
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

- assertVisible: "Add Lens"

# Enter lens name
- runFlow:
    file: ../helpers/input-text.yaml
    env:
      INPUT_ID: "lens-name-input"
      TEXT: "Test Generator Lens"

# WHEN I open the aperture generator
- tapOn:
    id: "aperture-generator-toggle"

# AND I enter 2.8 as max aperture (already default, just verify it's there)
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-max-aperture"
      TEXT: "2.8"

# AND I select half stops as increment
- tapOn:
    id: "increment-half"

# AND I enter 16 as min aperture (already default)
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-min-aperture"
      TEXT: "16"

# AND I tap generate
- tapOn:
    id: "generate-apertures-button"

# THEN the aperture list is populated with half-stop values from f/2.8 to f/16
- assertVisible: "f/2.8"
- assertVisible: "f/3.5"
- assertVisible: "f/4"
- assertVisible: "f/4.5"
- assertVisible: "f/5.6"
- assertVisible: "f/6.7"
- assertVisible: "f/8"
- assertVisible: "f/9.5"
- assertVisible: "f/11"
- assertVisible: "f/13"
- assertVisible: "f/16"

# AND I can save the lens successfully
- tapOn:
    id: "save-button"

- assertVisible: "Test Generator Lens"

# =============================================================================
# Scenario 2: Non-standard max aperture (f/1.5)
# =============================================================================
# GIVEN I am adding a lens
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

- assertVisible: "Add Lens"

# Enter lens name
- runFlow:
    file: ../helpers/input-text.yaml
    env:
      INPUT_ID: "lens-name-input"
      TEXT: "Voigtlander 35mm f/1.5"

# Open the aperture generator
- tapOn:
    id: "aperture-generator-toggle"

# WHEN I enter 1.5 as max aperture
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-max-aperture"
      TEXT: "1.5"

# AND I select half stops
- tapOn:
    id: "increment-half"

# AND I enter 16 as min aperture
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-min-aperture"
      TEXT: "16"

# AND I tap generate
- tapOn:
    id: "generate-apertures-button"

# THEN the list starts with f/1.5 exactly
- assertVisible: "f/1.5"

# AND subsequent apertures continue from nearest half stop
- assertVisible: "f/2"
- assertVisible: "f/2.8"
- assertVisible: "f/4"

# Save the lens
- tapOn:
    id: "save-button"

- assertVisible: "Voigtlander 35mm f/1.5"

# =============================================================================
# Scenario 3: Change stop increment and regenerate
# =============================================================================
# GIVEN I have generated apertures with whole stops
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

- assertVisible: "Add Lens"

# Enter lens name
- runFlow:
    file: ../helpers/input-text.yaml
    env:
      INPUT_ID: "lens-name-input"
      TEXT: "Increment Change Test"

# Open the aperture generator
- tapOn:
    id: "aperture-generator-toggle"

# Set max to 2.8
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-max-aperture"
      TEXT: "2.8"

# Set increment to whole
- tapOn:
    id: "increment-whole"

# Set min to 22
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-min-aperture"
      TEXT: "22"

# Generate with whole stops
- tapOn:
    id: "generate-apertures-button"

# Verify whole stop apertures
- assertVisible: "f/2.8"
- assertVisible: "f/4"
- assertVisible: "f/5.6"
- assertVisible: "f/8"
- assertVisible: "f/11"
- assertVisible: "f/16"
- assertVisible: "f/22"

# WHEN I change to half stops and regenerate
- tapOn:
    id: "aperture-generator-toggle"
- tapOn:
    id: "increment-half"

- tapOn:
    id: "generate-apertures-button"

# THEN the aperture list updates with half-stop values
- assertVisible: "f/3.5"
- assertVisible: "f/4.5"

# Save the lens
- tapOn:
    id: "save-button"

- assertVisible: "Increment Change Test"

# =============================================================================
# Scenario 4: Aperture bounds verification
# =============================================================================
# GIVEN I open the aperture generator
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

- assertVisible: "Add Lens"

# Open the aperture generator
- tapOn:
    id: "aperture-generator-toggle"

# WHEN I enter boundary values (0.5 to 64)
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-max-aperture"
      TEXT: "0.5"

# Set increment to whole
- tapOn:
    id: "increment-whole"

- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-min-aperture"
      TEXT: "64"

# AND I tap generate
- tapOn:
    id: "generate-apertures-button"

# THEN the aperture list includes boundary values
- assertVisible: "f/0.5"
- assertVisible: "f/64"

# Close the sheet without saving
- tapOn:
    id: "close-button"
