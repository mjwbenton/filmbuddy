appId: tech.mattb.filmbuddy
---
# =============================================================================
# Scenario: Rolls display order
# =============================================================================
# GIVEN I have multiple active and finished rolls
- runFlow:
    file: ../helpers/launch.yaml

# Create first roll (will be older active)
- runFlow:
    file: ../helpers/create-roll.yaml
    env:
      FILM_STOCK: "First Roll"
      ISO: "100"
      CAMERA: "Camera A"
# Wait for sheet to close and roll to appear
- assertVisible: "First Roll @ 100"

# Create second roll (will be newer active, should appear first)
- runFlow:
    file: ../helpers/create-roll.yaml
    env:
      FILM_STOCK: "Second Roll"
      ISO: "200"
      CAMERA: "Camera B"
# Wait for sheet to close and roll to appear
- assertVisible: "Second Roll @ 200"

# Create third roll and mark it finished
- runFlow:
    file: ../helpers/create-roll.yaml
    env:
      FILM_STOCK: "Finished Roll"
      ISO: "400"
      CAMERA: "Camera C"
# Wait for sheet to close and roll to appear
- assertVisible: "Finished Roll @ 400"
- tapOn: "Finished Roll @ 400"
- tapOn:
    id: "mark-finished-button"

# WHEN I view the Rolls screen
# (already viewing)

# THEN active rolls appear first (most recently loaded first),
#      followed by finished rolls (most recently finished first)
- assertVisible:
    id: "active-section-header"
- assertVisible:
    id: "finished-section-header"

# Verify active rolls are present
- assertVisible: "Second Roll @ 200"
- assertVisible: "First Roll @ 100"

# Verify finished roll is in finished section
- assertVisible: "Finished Roll @ 400"
