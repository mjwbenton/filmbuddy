appId: tech.mattb.filmbuddy
---
# Scenario: Cannot edit finished rolls
# GIVEN I have a finished roll
# WHEN I view the roll
# THEN edit options are not available (form is read-only)

# Setup: Create a roll and mark it as finished
- launchApp
- extendedWaitUntil:
    visible:
      id: "add-roll-button"
    timeout: 10000
- tapOn:
    id: "add-roll-button"
    retryTapIfNoChange: true
- tapOn:
    id: "film-stock-input"
- inputText: "Portra 400"
- hideKeyboard
- tapOn:
    id: "iso-picker"
- tapOn:
    id: "iso-option-400"
- tapOn:
    id: "camera-input"
- inputText: "Leica M6"
- hideKeyboard
- tapOn:
    id: "save-button"

# Mark the roll as finished
- tapOn: "Portra 400"
- tapOn:
    id: "mark-finished-button"

# GIVEN I have a finished roll - tap on it to view
- tapOn: "Portra 400"

# THEN the header says "Finished Roll" (not "Edit Roll")
- assertVisible: "Finished Roll"

# THEN there is no Save button visible
- assertNotVisible: "Save"

# THEN the Close button is shown instead of Cancel
- assertVisible: "Close"

# THEN Mark as Active button is available (not Mark as Finished)
- assertVisible:
    id: "mark-active-button"
