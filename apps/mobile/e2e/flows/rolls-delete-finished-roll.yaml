appId: tech.mattb.filmbuddy
---
# Scenario: Delete a finished roll
# GIVEN I have a finished roll
# WHEN I delete the roll
# THEN it is permanently removed

# Setup: Create a roll and mark it as finished
- launchApp
- extendedWaitUntil:
    visible:
      id: "add-roll-button"
    timeout: 10000
- tapOn:
    id: "add-roll-button"
    retryTapIfNoChange: true
- tapOn:
    id: "film-stock-input"
- inputText: "Gold 200"
- hideKeyboard
- tapOn:
    id: "iso-picker"
- tapOn:
    id: "iso-option-200"
- tapOn:
    id: "camera-input"
- inputText: "Olympus XA"
- hideKeyboard
- tapOn:
    id: "save-button"
- assertVisible: "Gold 200"

# Mark the roll as finished
- tapOn: "Gold 200"
- tapOn:
    id: "mark-finished-button"

# GIVEN I have a finished roll
- assertVisible: "Finished"
- assertVisible: "Gold 200"

# WHEN I delete the roll
- tapOn: "Gold 200"
- tapOn:
    id: "delete-button"
- tapOn: "Delete"

# THEN it is permanently removed
- assertNotVisible: "Gold 200"
