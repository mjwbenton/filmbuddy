appId: tech.mattb.filmbuddy
---
# Setup: Launch app and navigate to Gear tab
- runFlow:
    file: ../helpers/launch.yaml
- tapOn: "gear-tab"

# =============================================================================
# Scenario: Add a lens
# =============================================================================
# GIVEN I'm on the Gear screen
# WHEN I tap to add a lens, enter a name, and save
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

# Verify sheet is open
- assertVisible: "Add Lens"

- runFlow:
    file: ../helpers/input-text.yaml
    env:
      INPUT_ID: "lens-name-input"
      TEXT: "Summicron 50mm f/2"

# Add apertures (required for save)
- tapOn:
    id: "aperture-generator-toggle"

- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-max-aperture"
      TEXT: "2"

- tapOn:
    id: "increment-whole"

- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "generator-min-aperture"
      TEXT: "16"

- tapOn:
    id: "generate-apertures-button"

- tapOn:
    id: "save-button"

# THEN the lens appears in my lenses list
- assertVisible: "Summicron 50mm f/2"

# =============================================================================
# Scenario: Edit a lens
# =============================================================================
# GIVEN I have a lens in my gear library
- tapOn: "Summicron 50mm f/2"

# Verify edit sheet is open
- assertVisible: "Edit Lens"
- assertVisible:
    id: "save-button"
- assertVisible:
    id: "delete-button"

# WHEN I tap it, change the name, and save
- runFlow:
    file: ../helpers/edit-text.yaml
    env:
      INPUT_ID: "lens-name-input"
      TEXT: "Summilux 35mm f/1.4"
- tapOn:
    id: "save-button"

# THEN the lens is updated with the new name
- assertVisible: "Summilux 35mm f/1.4"
- assertNotVisible: "Summicron 50mm f/2"

# =============================================================================
# Scenario: Delete a lens
# =============================================================================
# GIVEN I have a lens in my gear library
- tapOn: "Summilux 35mm f/1.4"

# Verify edit sheet with delete button
- assertVisible: "Edit Lens"
- assertVisible:
    id: "delete-button"

# WHEN I delete it
- tapOn:
    id: "delete-button"
- tapOn: "Delete"

# THEN it is permanently removed from my library
- extendedWaitUntil:
    notVisible: "Summilux 35mm f/1.4"
    timeout: 5000
