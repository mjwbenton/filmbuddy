appId: tech.mattb.filmbuddy
---
# Scenario: Attempt to save incomplete roll
# GIVEN I'm adding a new roll
# WHEN I try to save without filling in all three fields
# THEN I cannot save (Save button is disabled)

- launchApp
- extendedWaitUntil:
    visible:
      id: "add-roll-button"
    timeout: 10000

# GIVEN: Open the add roll sheet
- tapOn:
    id: "add-roll-button"
    retryTapIfNoChange: true

# Verify the sheet is open
- assertVisible:
    id: "save-button"
- assertVisible:
    id: "cancel-button"

# WHEN: Leave all fields empty - Save button should be disabled
# Fill in only one field and verify Save is still disabled
- tapOn:
    id: "film-stock-input"
- inputText: "Portra 400"
- hideKeyboard

# Save should still be disabled (missing ISO and camera)
- assertVisible:
    id: "save-button"

# Fill in ISO but not camera
- tapOn:
    id: "iso-picker"
- tapOn:
    id: "iso-option-400"

# Save should still be disabled (missing camera)
- assertVisible:
    id: "save-button"

# Clean up: Cancel and return to rolls screen
- tapOn:
    id: "cancel-button"
