appId: tech.mattb.filmbuddy
---
# Scenario: Edit an active roll
# GIVEN I have an active roll
# WHEN I edit the film stock, ISO, or camera and save
# THEN the roll is updated with the new values

# GIVEN: Create an active roll first
- launchApp
- extendedWaitUntil:
    visible:
      id: "add-roll-button"
    timeout: 10000
- tapOn:
    id: "add-roll-button"
    retryTapIfNoChange: true
- tapOn:
    id: "film-stock-input"
- inputText: "Portra 400"
- hideKeyboard
- tapOn:
    id: "iso-picker"
- tapOn:
    id: "iso-option-400"
- tapOn:
    id: "camera-input"
- inputText: "Leica M6"
- hideKeyboard
- tapOn:
    id: "save-button"

# Verify roll was created
- assertVisible: "Portra 400"
- assertVisible: "Leica M6"

# WHEN: Tap on the roll to edit it
- tapOn: "Portra 400"

# Edit film stock
- tapOn:
    id: "film-stock-input"
- eraseText
- inputText: "Ektar 100"
- hideKeyboard

# Edit ISO
- tapOn:
    id: "iso-picker"
- tapOn:
    id: "iso-option-100"

# Edit camera
- tapOn:
    id: "camera-input"
- eraseText
- inputText: "Contax T2"
- hideKeyboard

# Save changes
- tapOn:
    id: "save-button"

# THEN: Verify the roll is updated with new values
- assertVisible: "Ektar 100"
- assertVisible: "Contax T2"
- assertNotVisible: "Portra 400"
- assertNotVisible: "Leica M6"
