appId: tech.mattb.filmbuddy
---
# GIVEN I have an active roll
- launchApp
- extendedWaitUntil:
    visible:
      id: "add-roll-button"
    timeout: 10000
- tapOn:
    id: "add-roll-button"
    retryTapIfNoChange: true
- tapOn:
    id: "film-stock-input"
- inputText: "Portra 400"
- hideKeyboard
- tapOn:
    id: "iso-picker"
- tapOn:
    id: "iso-option-400"
- tapOn:
    id: "camera-input"
- inputText: "Leica M6"
- hideKeyboard
- tapOn:
    id: "save-button"

# WHEN I mark the roll as finished
- tapOn: "Portra 400"
- tapOn:
    id: "mark-finished-button"

# THEN it moves to the finished section with today's date shown as the finished date
- assertVisible:
    id: "finished-section-header"
- assertVisible: "Portra 400"
