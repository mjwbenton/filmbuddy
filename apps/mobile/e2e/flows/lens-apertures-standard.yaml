appId: tech.mattb.filmbuddy
---
# Setup: Launch app and navigate to Gear tab
- runFlow:
    file: ../helpers/launch.yaml
- tapOn: "gear-tab"

# =============================================================================
# Scenario: Configure apertures for a lens (standard mode)
# =============================================================================
# GIVEN I am editing a lens
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

# Verify sheet is open with aperture section
- assertVisible: "Add Lens"
- assertVisible: "Apertures"

# Verify Standard mode is selected by default
- assertVisible:
    id: "aperture-mode-standard"
- assertVisible:
    id: "aperture-mode-custom"

# WHEN I select a maximum aperture (e.g., f/2.8)
- tapOn:
    id: "max-aperture-picker"
- tapOn: "f/2.8"

# AND I select the stop increment (half stops)
- tapOn:
    id: "increment-half"

# AND I select a minimum aperture (e.g., f/16)
- tapOn:
    id: "min-aperture-picker"
- tapOn: "f/16"

# THEN the available apertures are calculated from max to min using the selected increment
# Verify preview shows correct apertures for f/2.8 to f/16 in half stops
- assertVisible:
    id: "aperture-preview"
- assertVisible: "f/2.8"
- assertVisible: "f/4"
- assertVisible: "f/5.6"
- assertVisible: "f/8"
- assertVisible: "f/11"
- assertVisible: "f/16"

# Enter lens name and save
- tapOn:
    id: "lens-name-input"
- inputText: "Nikkor 50mm f/2.8"
- hideKeyboard
- tapOn:
    id: "save-button"

# THEN the lens stores these settings
- assertVisible: "Nikkor 50mm f/2.8"

# =============================================================================
# Scenario: Lens with non-standard max aperture
# =============================================================================
# GIVEN I am editing a lens with max aperture f/1.5
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

# WHEN I select f/1.5 as the max aperture
- tapOn:
    id: "max-aperture-picker"
- tapOn: "f/1.5"

# AND I select half stops as the increment
- tapOn:
    id: "increment-half"

# Set min aperture
- tapOn:
    id: "min-aperture-picker"
- tapOn: "f/16"

# THEN the aperture list starts with f/1.5 exactly
- assertVisible: "f/1.5"

# AND subsequent apertures are generated by rounding f/1.5 to the nearest half stop (f/1.4) and incrementing from there
- assertVisible: "f/2"
- assertVisible: "f/2.8"
- assertVisible: "f/4"

# Enter name and save
- tapOn:
    id: "lens-name-input"
- inputText: "Voigtlander 35mm f/1.5"
- hideKeyboard
- tapOn:
    id: "save-button"

- assertVisible: "Voigtlander 35mm f/1.5"

# =============================================================================
# Scenario: Change stop increment on existing lens
# =============================================================================
# GIVEN I have a lens configured with whole stops from f/2.8 to f/22
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

- tapOn:
    id: "max-aperture-picker"
- tapOn: "f/2.8"
- tapOn:
    id: "increment-whole"
- tapOn:
    id: "min-aperture-picker"
- tapOn: "f/22"

# Verify whole stop apertures
- assertVisible: "f/2.8"
- assertVisible: "f/4"
- assertVisible: "f/5.6"
- assertVisible: "f/8"
- assertVisible: "f/11"
- assertVisible: "f/16"
- assertVisible: "f/22"

# Save the lens first
- tapOn:
    id: "lens-name-input"
- inputText: "Test Lens Whole Stops"
- hideKeyboard
- tapOn:
    id: "save-button"

# Now edit the lens
- tapOn: "Test Lens Whole Stops"
- assertVisible: "Edit Lens"

# WHEN I edit the lens and change the increment to half stops
- tapOn:
    id: "increment-half"

# THEN the available apertures are recalculated using the new increment
# Half stops between f/2.8 and f/22 should include intermediate values like f/3.5
- assertVisible: "f/2.8"
- assertVisible: "f/3.5"
- assertVisible: "f/4"
- assertVisible: "f/4.5"
- assertVisible: "f/5.6"

# Save changes
- tapOn:
    id: "save-button"

# =============================================================================
# Scenario: Min aperture wider than max (error)
# =============================================================================
# GIVEN I am configuring apertures for a lens
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

# WHEN I select a minimum aperture wider than the maximum (e.g., max f/4, min f/2)
- tapOn:
    id: "max-aperture-picker"
- tapOn: "f/4"

- tapOn:
    id: "min-aperture-picker"
- tapOn: "f/2"

# THEN I see an error message
- assertVisible:
    id: "aperture-error"

# Enter a name and try to save
- tapOn:
    id: "lens-name-input"
- inputText: "Invalid Aperture Lens"
- hideKeyboard

# AND I cannot save until corrected
# Save button should be disabled or show error on tap
- tapOn:
    id: "save-button"

# Verify we're still on the sheet (save was prevented)
- assertVisible: "Add Lens"

# Fix the error by setting correct min aperture
- tapOn:
    id: "min-aperture-picker"
- tapOn: "f/16"

# Error should be cleared
- assertNotVisible:
    id: "aperture-error"

# Cancel without saving this test lens
- tapOn:
    id: "close-button"

# =============================================================================
# Scenario: Aperture bounds (verified during picker interactions above)
# =============================================================================
# The widest selectable max aperture is f/0.5
# The smallest selectable min aperture is f/64
# These bounds are implicitly tested by the picker options available
# Additional explicit verification:
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true

# Verify f/0.5 is available as max aperture option
- tapOn:
    id: "max-aperture-picker"
- assertVisible: "f/0.5"
- tapOn: "f/2"

# Verify f/64 is available as min aperture option
- tapOn:
    id: "min-aperture-picker"
- assertVisible: "f/64"
- tapOn: "f/16"

# Cancel
- tapOn:
    id: "close-button"
