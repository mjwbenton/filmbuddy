appId: tech.mattb.filmbuddy
env:
  LENS_NAME: ${LENS_NAME || "Summicron 50mm f/2"}
---
# Helper: Create a lens with configurable name and default apertures
# Parameters:
#   LENS_NAME: Lens name (default: "Summicron 50mm f/2")
- tapOn:
    id: "add-lens-button"
    retryTapIfNoChange: true
- runFlow:
    file: ./input-text.yaml
    env:
      INPUT_ID: "lens-name-input"
      TEXT: ${LENS_NAME}

# Add default apertures using generator (f/2 to f/16, whole stops)
- tapOn:
    id: "aperture-generator-toggle"
- runFlow:
    file: ./edit-text.yaml
    env:
      INPUT_ID: "generator-max-aperture"
      TEXT: "2"
- tapOn:
    id: "increment-whole"
- runFlow:
    file: ./edit-text.yaml
    env:
      INPUT_ID: "generator-min-aperture"
      TEXT: "16"
- runFlow: ./hide-keyboard.yaml
- tapOn:
    id: "generate-apertures-button"

- tapOn:
    id: "save-button"
