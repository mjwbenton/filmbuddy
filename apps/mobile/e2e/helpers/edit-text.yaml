appId: tech.mattb.filmbuddy
env:
  INPUT_ID: ${INPUT_ID}
  TEXT: ${TEXT}
---
# Helper: Clear and replace text in an input field
# Parameters:
#   INPUT_ID: The testID of the input field
#   TEXT: The new text to enter
# Note: Does not hide keyboard - caller should hide if needed
- tapOn:
    id: ${INPUT_ID}
    retryTapIfNoChange: false
- eraseText
- inputText: ${TEXT}
